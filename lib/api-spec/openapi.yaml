openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trak fitness coaching platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: workouts
    description: Workout programs and logs
  - name: exercises
    description: Exercise library
  - name: measurements
    description: Body measurements
  - name: sleep
    description: Sleep logs
  - name: nutrition
    description: Nutrition screenshots
  - name: photos
    description: Progress photos
  - name: assignments
    description: Coach assignments
  - name: messages
    description: In-app messaging
  - name: invites
    description: Client invite links
  - name: dashboard
    description: Dashboard aggregates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Clients ──────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{clientId}/status:
    patch:
      operationId: updateClientStatus
      tags: [clients]
      summary: Activate or deactivate a client (coach only)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "403":
          description: Coach only
        "404":
          description: Not found

  # ── Invite Links ──────────────────────────────────────────────────────────
  /clients/{clientId}/invite:
    post:
      operationId: generateInviteLink
      tags: [invites]
      summary: Generate or refresh an invite link for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"

  /invite/{token}:
    get:
      operationId: getInvite
      tags: [invites]
      summary: Get invite info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        "404":
          description: Invalid or expired token

  /invite/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invite as the currently signed-in Clerk user
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAcceptResult"
        "401":
          description: Not signed in
        "403":
          description: Email mismatch or already claimed by another account
        "404":
          description: Invalid or expired token

  /clients/me:
    get:
      operationId: getMyClient
      tags: [clients]
      summary: Get the client record for the currently signed-in Clerk user
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Not signed in
        "404":
          description: No client account found for this user

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/coach:
    get:
      operationId: getCoachDashboard
      tags: [dashboard]
      summary: Get coach dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachDashboard"

  /dashboard/client/{clientId}:
    get:
      operationId: getClientDashboard
      tags: [dashboard]
      summary: Get a single client's dashboard summary
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDashboard"

  # ── Exercises (library) ───────────────────────────────────────────────────
  /exercises:
    get:
      operationId: listExercises
      tags: [exercises]
      summary: List all exercises
      responses:
        "200":
          description: Exercise list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
    post:
      operationId: createExercise
      tags: [exercises]
      summary: Create an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"

  # ── Workout Programs ──────────────────────────────────────────────────────
  /programs:
    get:
      operationId: listPrograms
      tags: [workouts]
      summary: List all workout programs
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [workouts]
      summary: Create a workout program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/{programId}:
    get:
      operationId: getProgram
      tags: [workouts]
      summary: Get a program with its days and exercises
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
    patch:
      operationId: updateProgram
      tags: [workouts]
      summary: Update a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    delete:
      operationId: deleteProgram
      tags: [workouts]
      summary: Delete a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/phases:
    post:
      operationId: createProgramPhase
      tags: [workouts]
      summary: Add a phase to a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramPhaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPhase"

  /programs/{programId}/phases/{phaseId}:
    patch:
      operationId: updateProgramPhase
      tags: [workouts]
      summary: Update a program phase
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramPhaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPhase"
    delete:
      operationId: deleteProgramPhase
      tags: [workouts]
      summary: Delete a program phase
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/days:
    post:
      operationId: createProgramDay
      tags: [workouts]
      summary: Add a day to a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDayInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDay"

  /programs/{programId}/days/{dayId}:
    patch:
      operationId: updateProgramDay
      tags: [workouts]
      summary: Update a program day
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDayUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDay"
    delete:
      operationId: deleteProgramDay
      tags: [workouts]
      summary: Delete a program day
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/days/{dayId}/exercises:
    post:
      operationId: addExerciseToDay
      tags: [workouts]
      summary: Add an exercise to a program day
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramExerciseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramExercise"

  /programs/{programId}/days/{dayId}/exercises/{peId}:
    patch:
      operationId: updateProgramExercise
      tags: [workouts]
      summary: Update a program day exercise
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: peId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramExerciseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramExercise"
    delete:
      operationId: deleteProgramExercise
      tags: [workouts]
      summary: Delete a program day exercise
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: peId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Program Assignments ───────────────────────────────────────────────────
  /clients/{clientId}/program-assignment:
    get:
      operationId: getClientProgramAssignment
      tags: [workouts]
      summary: Get the active program assigned to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramAssignment"
        "404":
          description: No active program
    post:
      operationId: assignProgram
      tags: [workouts]
      summary: Assign a program to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramAssignmentInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramAssignment"

  # ── Workout Logs ──────────────────────────────────────────────────────────
  /clients/{clientId}/workout-logs:
    get:
      operationId: listWorkoutLogs
      tags: [workouts]
      summary: List workout logs for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutLog"
    post:
      operationId: createWorkoutLog
      tags: [workouts]
      summary: Log a completed workout
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutLog"

  /clients/{clientId}/workout-logs/{logId}:
    get:
      operationId: getWorkoutLog
      tags: [workouts]
      summary: Get a workout log with set details
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: logId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout log detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutLogDetail"
    patch:
      operationId: updateWorkoutLog
      tags: [workouts]
      summary: Update a workout log (early exit reason, status, etc.)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: logId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutLogUpdate"
      responses:
        "200":
          description: Updated workout log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutLog"

  /clients/{clientId}/workout-logs/{logId}/sets:
    post:
      operationId: logSet
      tags: [workouts]
      summary: Log a set within a workout
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: logId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLogInput"
      responses:
        "201":
          description: Set logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLog"

  # ── Measurements ──────────────────────────────────────────────────────────
  /clients/{clientId}/measurements:
    get:
      operationId: listMeasurements
      tags: [measurements]
      summary: List measurement entries for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Measurement"
    post:
      operationId: logMeasurement
      tags: [measurements]
      summary: Log a measurement entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"

  /clients/{clientId}/measurements/{measurementId}:
    delete:
      operationId: deleteMeasurement
      tags: [measurements]
      summary: Delete a measurement entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: measurementId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Sleep Logs ────────────────────────────────────────────────────────────
  /clients/{clientId}/sleep:
    get:
      operationId: listSleepLogs
      tags: [sleep]
      summary: List sleep logs for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sleep logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLog"
    post:
      operationId: logSleep
      tags: [sleep]
      summary: Log a sleep entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SleepLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"

  /clients/{clientId}/sleep/{sleepId}:
    delete:
      operationId: deleteSleepLog
      tags: [sleep]
      summary: Delete a sleep log
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: sleepId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Nutrition Screenshots ─────────────────────────────────────────────────
  /clients/{clientId}/nutrition:
    get:
      operationId: listNutritionLogs
      tags: [nutrition]
      summary: List nutrition screenshot entries for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nutrition logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NutritionLog"
    post:
      operationId: createNutritionLog
      tags: [nutrition]
      summary: Create a nutrition log entry (with screenshot URL)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionLog"

  /clients/{clientId}/nutrition/{nutritionId}:
    delete:
      operationId: deleteNutritionLog
      tags: [nutrition]
      summary: Delete a nutrition log entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: nutritionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Progress Photos ───────────────────────────────────────────────────────
  /clients/{clientId}/photos:
    get:
      operationId: listProgressPhotos
      tags: [photos]
      summary: List progress photos for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressPhoto"
    post:
      operationId: createProgressPhoto
      tags: [photos]
      summary: Upload a progress photo entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhoto"

  /clients/{clientId}/photos/{photoId}:
    delete:
      operationId: deleteProgressPhoto
      tags: [photos]
      summary: Delete a progress photo
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Assignments ───────────────────────────────────────────────────────────
  /clients/{clientId}/assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create an assignment for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /clients/{clientId}/assignments/{assignmentId}:
    patch:
      operationId: updateAssignment
      tags: [assignments]
      summary: Update an assignment
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{clientId}/assignments/{assignmentId}/complete:
    post:
      operationId: completeAssignment
      tags: [assignments]
      summary: Mark an assignment as complete (client action)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  # ── Messages ──────────────────────────────────────────────────────────────
  /clients/{clientId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages between coach and client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /clients/{clientId}/messages/read:
    patch:
      operationId: markMessagesRead
      tags: [messages]
      summary: Mark messages as read
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkReadResult"

  /coach/unread-count:
    get:
      operationId: getCoachUnreadCount
      tags: [messages]
      summary: Get total unread message count for coach
      responses:
        "200":
          description: Unread counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /push-subscriptions:
    post:
      operationId: savePushSubscription
      tags: [messages]
      summary: Save a push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: Saved

  # ── Coach Notes ───────────────────────────────────────────────────────────
  /clients/{clientId}/coach-notes:
    get:
      operationId: listCoachNotes
      tags: [coach]
      summary: List private coach notes for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coach notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachNote"
    post:
      operationId: createCoachNote
      tags: [coach]
      summary: Create a private coach note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachNoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNote"

  /clients/{clientId}/coach-notes/{noteId}:
    patch:
      operationId: updateCoachNote
      tags: [coach]
      summary: Update a coach note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachNoteInput"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNote"
    delete:
      operationId: deleteCoachNote
      tags: [coach]
      summary: Delete a coach note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Call Logs ─────────────────────────────────────────────────────────────
  /clients/{clientId}/call-logs:
    get:
      operationId: listCallLogs
      tags: [coach]
      summary: List coaching call logs for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallLog"
    post:
      operationId: createCallLog
      tags: [coach]
      summary: Log a coaching call
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallLogInput"
      responses:
        "201":
          description: Call logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallLog"

  /clients/{clientId}/call-logs/{callId}:
    patch:
      operationId: updateCallLog
      tags: [coach]
      summary: Update a call log
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: callId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallLogInput"
      responses:
        "200":
          description: Updated call log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallLog"
    delete:
      operationId: deleteCallLog
      tags: [coach]
      summary: Delete a call log
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: callId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
