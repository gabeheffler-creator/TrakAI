      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coach notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachNote"
    post:
      operationId: createCoachNote
      tags: [coach]
      summary: Create a private coach note
      parameters:
        - name: clientId
          in: path
          required: true
