              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

components:
  schemas:
    NativeLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        role: { type: string, enum: [coach, client] }
        deviceLabel: { type: string, maxLength: 120 }
    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    NativeTokenPair:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt, refreshExpiresAt, sessionId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }
        sessionId: { type: string, format: uuid }
        role: { type: string, enum: [coach, client] }
        id: { type: integer }
    AuthSession:
      type: object
      required: [id, kind, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [cookie, native] }
        device_label: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    PasswordResetRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    PasswordResetConfirmation:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
    EmailVerificationConfirmation:
      type: object
      required: [token]
      properties: { token: { type: string, minLength: 1 } }
    EmailVerificationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [coach, client] }
    InviteRegistrationInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [ok, role, id, name]
      properties:
        ok:
          type: boolean
        role:
          type: string
          enum: [coach, client]
        id:
          type: integer
        name:
          type: string

    AuthUser:
      type: object
      required: [role, id, name]
      properties:
        role:
          type: string
          enum: [coach, client]
        id:
          type: integer
        name:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Client ──────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        goal:
          type: ["string", "null"]
        goalTargetDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        inviteToken:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        programName:
          type: ["string", "null"]
        hasStalePendingTask:
          type: boolean
        connectedAlarmAppId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]

    ClientInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        goal:
          type: string
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        goal:
          type: ["string", "null"]
        goalTargetDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        connectedAlarmAppId:
          type: ["string", "null"]

    ClientStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]

    ClientGoalInput:
      type: object
      required: [goal]
      properties:
        goal:
          type: string
          minLength: 1
        goalTargetDate:
          type: ["string", "null"]

    ClientGoalHistory:
      type: object
      required: [id, clientId, goal, archivedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        goal:
          type: string
        goalTargetDate:
          type: ["string", "null"]
        archivedAt:
          type: string
          format: date-time

    ActivityHeatmapEntry:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    InviteLink:
      type: object
      required: [token, url]
      properties:
        token:
          type: string
        url:
          type: string

    InviteInfo:
      type: object
      required: [clientName, coachName]
      properties:
        clientName:
          type: string
        coachName:
          type: string

    InviteAcceptResult:
      type: object
      required: [clientId, clientName, alreadyJoined]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        alreadyJoined:
          type: boolean

    # ── Dashboard ───────────────────────────────────────────────────────────
    CoachDashboard:
      type: object
      required: [totalClients, activePrograms, recentActivity]
      properties:
        totalClients:
          type: integer
        activePrograms:
          type: integer
        staleTaskClientCount:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        clientSummaries:
          type: array
          items:
            $ref: "#/components/schemas/ClientSummary"

    ClientSummary:
      type: object
      required: [clientId, name, lastWorkout, lastCheckin, assignmentsDue]
      properties:
        clientId:
          type: integer
        name:
          type: string
        lastWorkout:
          type: ["string", "null"]
          format: date-time
        lastCheckin:
          type: ["string", "null"]
          format: date-time
        assignmentsDue:
          type: integer
        unreadMessages:
          type: integer

    ActivityItem:
      type: object
      required: [type, clientId, clientName, description, createdAt]
      properties:
        type:
          type: string
        clientId:
          type: integer
        clientName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    ClientDashboard:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        currentProgram:
          $ref: "#/components/schemas/ProgramDetail"
        latestMeasurement:
          $ref: "#/components/schemas/Measurement"
        workoutsThisWeek:
          type: integer
        pendingAssignments:
          type: integer
        recentWorkouts:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutLog"
        weightHistory:
          type: array
          items:
            $ref: "#/components/schemas/WeightPoint"

    WeightPoint:
      type: object
      required: [date, weight]
      properties:
        date:
          type: string
          format: date
        weight:
          type: number

    # ── Exercise Library ────────────────────────────────────────────────────
    Exercise:
      type: object
      required: [id, name, muscleGroup, isCompound]
      properties:
        id:
          type: integer
        name:
          type: string
        muscleGroup:
          type: string
        isCompound:
          type: boolean
        movementPattern:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ExerciseInput:
      type: object
      required: [name, muscleGroup]
      properties:
        name:
          type: string
          minLength: 1
        muscleGroup:
          type: string
          minLength: 1
        isCompound:
          type: boolean
        movementPattern:
          type: string
        description:
          type: string
        videoUrl:
          type: string

    ExercisePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        muscleGroup:
          type: string
          minLength: 1
        isCompound:
          type: boolean
        movementPattern:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]

    # ── Program ─────────────────────────────────────────────────────────────
    Program:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        durationWeeks:
          type: ["integer", "null"]
        status:
          type: string
          enum: [draft, approved]
        clientId:
          type: ["integer", "null"]
        sourceTemplateId:
          type: ["integer", "null"]
        sleepAdjustEnabled:
          type: boolean
        sleepAdjustPercent:
          type: integer
        createdAt:
          type: string
          format: date-time

    AiProgramInput:
      type: object
      required: [goalText]
      properties:
        goalText:
          type: string
          minLength: 1
          description: Training goal or objective to build the program around
        durationWeeks:
          type: integer
          description: Suggested program duration in weeks
        clientId:
          type: integer
          description: Optional client ID to pull their existing goal and context

    ProgramInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        durationWeeks:
          type: integer

    ProgramSleepAdjustment:
      type: object
      required: [sleepAdjustEnabled, sleepAdjustPercent]
      properties:
        sleepAdjustEnabled:
          type: boolean
        sleepAdjustPercent:
          type: integer
          minimum: 0
          maximum: 50

    ProgramUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        durationWeeks:
          type: ["integer", "null"]

    ProgramPhase:
      type: object
      required: [id, programId, name, order, durationWeeks]
      properties:
        id:
          type: integer
        programId:
          type: integer
        name:
          type: string
        order:
          type: integer
        durationWeeks:
          type: integer
        daysPerWeek:
          type: integer
          nullable: true

    ProgramPhaseInput:
      type: object
      required: [name, durationWeeks]
      properties:
        name:
          type: string
          minLength: 1
        durationWeeks:
          type: integer
          minimum: 1
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
        order:
          type: integer

    ProgramPhaseUpdate:
      type: object
      properties:
        name:
          type: string
        durationWeeks:
          type: integer
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
        order:
          type: integer

    ProgramPhaseDetail:
      type: object
      required: [id, name, order, durationWeeks, days]
      properties:
        id:
          type: integer
        name:
          type: string
        order:
          type: integer
        durationWeeks:
          type: integer
        daysPerWeek:
          type: integer
          nullable: true
        nutritionGoal:
          $ref: "#/components/schemas/ProgramNutritionGoal"
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayDetail"

    ProgramNutritionGoal:
      type: object
      required: [id, phaseId, dayId]
      properties:
        id:
          type: integer
        phaseId:
          type: integer
        dayId:
          type: ["integer", "null"]
        calories:
          type: ["integer", "null"]
        protein:
          type: ["integer", "null"]
        carbs:
          type: ["integer", "null"]
        fat:
          type: ["integer", "null"]

    ProgramNutritionGoalInput:
      type: object
      properties:
        calories:
          type: integer
          nullable: true
        protein:
          type: integer
          nullable: true
        carbs:
          type: integer
          nullable: true
        fat:
          type: integer
          nullable: true

    ProgramDetail:
      type: object
      required: [id, name, status, days, phases]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        durationWeeks:
          type: ["integer", "null"]
        status:
          type: string
          enum: [draft, approved]
        clientId:
          type: ["integer", "null"]
        sourceTemplateId:
          type: ["integer", "null"]
        sleepAdjustEnabled:
          type: boolean
        sleepAdjustPercent:
          type: integer
        phases:
          type: array
          items:
            $ref: "#/components/schemas/ProgramPhaseDetail"
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayDetail"
        createdAt:
          type: string
          format: date-time

    ProgramDay:
      type: object
      required: [id, programId, dayNumber, name]
      properties:
        id:
          type: integer
        programId:
          type: integer
        dayNumber:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        phaseId:
          type: ["integer", "null"]

    ProgramDayInput:
      type: object
      required: [dayNumber, name]
      properties:
        dayNumber:
          type: integer
        name:
          type: string
          minLength: 1
        notes:
          type: string
        phaseId:
          type: integer

    ProgramDayUpdate:
      type: object
      properties:
        dayNumber:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        phaseId:
          type: ["integer", "null"]

    ProgramDayDetail:
      type: object
      required: [id, dayNumber, name, exercises]
      properties:
        id:
          type: integer
        dayNumber:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        phaseId:
          type: ["integer", "null"]
        nutritionGoalOverride:
          $ref: "#/components/schemas/ProgramNutritionGoal"
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramExerciseDetail"

    ProgramExercise:
      type: object
      required: [id, dayId, exerciseId, sets, reps, order]
      properties:
        id:
          type: integer
        dayId:
          type: integer
        exerciseId:
          type: integer
        sets:
          type: integer
        reps:
          type: string
        order:
          type: integer
        weight:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        restSeconds:
          type: ["integer", "null"]

    ProgramExerciseInput:
      type: object
      required: [exerciseId, sets, reps, order]
      properties:
        exerciseId:
          type: integer
        sets:
          type: integer
        reps:
          type: string
          minLength: 1
        order:
          type: integer
        weight:
          type: string
        notes:
          type: string
        restSeconds:
          type: integer

    ProgramExerciseUpdate:
      type: object
      properties:
        exerciseId:
          type: integer
        sets:
          type: integer
        reps:
          type: string
        order:
          type: integer
        weight:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        restSeconds:
          type: ["integer", "null"]

    ProgramExerciseDetail:
      type: object
      required: [id, exerciseId, exerciseName, muscleGroup, sets, reps, order]
      properties:
        id:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        muscleGroup:
          type: string
        sets:
          type: integer
        reps:
          type: string
        order:
          type: integer
        weight:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        restSeconds:
          type: ["integer", "null"]

    # ── Program Assignment ──────────────────────────────────────────────────
    ProgramAssignmentHistoryItem:
      type: object
      required: [id, clientId, programName, startDate, durationWeeks]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        programId:
          type: ["integer", "null"]
        programName:
          type: string
        sourceTemplateId:
          type: ["integer", "null"]
        sourceTemplateName:
          type: ["string", "null"]
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        durationWeeks:
          type: ["integer", "null"]

    ProgramAssignment:
      type: object
      required: [id, clientId, programId, programName, startDate]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        programId:
          type: integer
        programName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date

    ProgramAssignmentInput:
      type: object
      required: [programId, startDate]
      properties:
        programId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    ProgramAssignedClient:
      type: object
      required: [clientId, clientName, assignedAt]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        assignedAt:
          type: string
          format: date-time

    BulkAssignProgramInput:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: array
          items:
            type: integer

    BulkAssignProgramResult:
      type: object
      required: [assigned, skipped]
      properties:
        assigned:
          type: array
          items:
            type: integer
        skipped:
          type: array
          items:
            type: integer

    SyncProgramToClientsInput:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: array
          items:
            type: integer

    SyncProgramToClientsResult:
      type: object
      required: [synced]
      properties:
        synced:
          type: array
          items:
            type: integer

    # ── Workout Logs ────────────────────────────────────────────────────────
    WorkoutLog:
      type: object
      required: [id, clientId, date, status, automaticAdjustmentDecision, createdAt]
      properties:
        id:
          type: integer
