  # ── Upload URL ────────────────────────────────────────────────────────────
  /upload-url:
    post:
      operationId: getUploadUrl
      tags: [photos]
      summary: Get a pre-signed URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Client ──────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        goal:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        inviteToken:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time

    ClientInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        goal:
          type: string
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        goal:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ClientStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]

    InviteLink:
      type: object
      required: [token, url]
      properties:
        token:
          type: string
        url:
          type: string

    InviteInfo:
      type: object
      required: [clientId, clientName, clientEmail]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        clientEmail:
          type: string

    InviteAcceptResult:
      type: object
      required: [clientId, clientName, alreadyJoined]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        alreadyJoined:
          type: boolean

    # ── Dashboard ───────────────────────────────────────────────────────────
    CoachDashboard:
      type: object
      required: [totalClients, activePrograms, recentActivity]
      properties:
        totalClients:
          type: integer
        activePrograms:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        clientSummaries:
          type: array
          items:
            $ref: "#/components/schemas/ClientSummary"

    ClientSummary:
      type: object
      required: [clientId, name, lastWorkout, lastCheckin, assignmentsDue]
      properties:
        clientId:
          type: integer
        name:
          type: string
        lastWorkout:
          type: ["string", "null"]
          format: date-time
        lastCheckin:
          type: ["string", "null"]
          format: date-time
        assignmentsDue:
          type: integer
        unreadMessages:
          type: integer

    ActivityItem:
      type: object
      required: [type, clientId, clientName, description, createdAt]
      properties:
        type:
          type: string
        clientId:
          type: integer
        clientName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    ClientDashboard:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        currentProgram:
          $ref: "#/components/schemas/ProgramDetail"
        latestMeasurement:
          $ref: "#/components/schemas/Measurement"
        workoutsThisWeek:
          type: integer
        pendingAssignments:
          type: integer
        recentWorkouts:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutLog"
        weightHistory:
          type: array
          items:
            $ref: "#/components/schemas/WeightPoint"

    WeightPoint:
      type: object
      required: [date, weight]
      properties:
        date:
          type: string
          format: date
        weight:
          type: number

    # ── Exercise Library ────────────────────────────────────────────────────
    Exercise:
      type: object
      required: [id, name, muscleGroup]
      properties:
        id:
          type: integer
        name:
          type: string
        muscleGroup:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ExerciseInput:
      type: object
      required: [name, muscleGroup]
      properties:
        name:
          type: string
          minLength: 1
        muscleGroup:
          type: string
          minLength: 1
        description:
          type: string

    # ── Program ─────────────────────────────────────────────────────────────
    Program:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        durationWeeks:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    ProgramInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        durationWeeks:
          type: integer

    ProgramUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        durationWeeks:
          type: ["integer", "null"]

    ProgramPhase:
      type: object
      required: [id, programId, name, order, durationWeeks]
      properties:
        id:
          type: integer
        programId:
          type: integer
        name:
          type: string
        order:
          type: integer
        durationWeeks:
          type: integer
        daysPerWeek:
          type: integer
          nullable: true

    ProgramPhaseInput:
      type: object
      required: [name, durationWeeks]
      properties:
        name:
          type: string
          minLength: 1
        durationWeeks:
          type: integer
          minimum: 1
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
        order:
          type: integer

    ProgramPhaseUpdate:
      type: object
      properties:
        name:
          type: string
        durationWeeks:
          type: integer
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
        order:
          type: integer

    ProgramPhaseDetail:
      type: object
      required: [id, name, order, durationWeeks, days]
      properties:
        id:
          type: integer
        name:
          type: string
        order:
          type: integer
        durationWeeks:
          type: integer
        daysPerWeek:
          type: integer
          nullable: true
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayDetail"

    ProgramDetail:
      type: object
      required: [id, name, days, phases]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        durationWeeks:
          type: ["integer", "null"]
        phases:
          type: array
          items:
            $ref: "#/components/schemas/ProgramPhaseDetail"
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProgramDayDetail"
        createdAt:
          type: string
          format: date-time

    ProgramDay:
      type: object
      required: [id, programId, dayNumber, name]
      properties:
        id:
          type: integer
        programId:
          type: integer
        dayNumber:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        phaseId:
          type: ["integer", "null"]

    ProgramDayInput:
      type: object
      required: [dayNumber, name]
      properties:
        dayNumber:
          type: integer
        name:
          type: string
          minLength: 1
        notes:
          type: string
        phaseId:
          type: integer

    ProgramDayUpdate:
      type: object
      properties:
        dayNumber:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        phaseId:
          type: ["integer", "null"]

    ProgramDayDetail:
      type: object
      required: [id, dayNumber, name, exercises]
      properties:
        id:
          type: integer
        dayNumber:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        phaseId:
          type: ["integer", "null"]
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ProgramExerciseDetail"

    ProgramExercise:
      type: object
      required: [id, dayId, exerciseId, sets, reps, order]
      properties:
        id:
          type: integer
        dayId:
          type: integer
        exerciseId:
          type: integer
        sets:
          type: integer
        reps:
          type: string
        order:
          type: integer
        weight:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        restSeconds:
          type: ["integer", "null"]

    ProgramExerciseInput:
      type: object
      required: [exerciseId, sets, reps, order]
      properties:
        exerciseId:
          type: integer
        sets:
          type: integer
        reps:
          type: string
          minLength: 1
        order:
          type: integer
        weight:
          type: string
        notes:
          type: string
        restSeconds:
          type: integer

    ProgramExerciseUpdate:
      type: object
      properties:
        sets:
          type: integer
        reps:
          type: string
        order:
          type: integer
        weight:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        restSeconds:
          type: ["integer", "null"]

    ProgramExerciseDetail:
      type: object
      required: [id, exerciseId, exerciseName, muscleGroup, sets, reps, order]
      properties:
        id:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        muscleGroup:
          type: string
        sets:
          type: integer
        reps:
          type: string
        order:
          type: integer
        weight:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        restSeconds:
          type: ["integer", "null"]

    # ── Program Assignment ──────────────────────────────────────────────────
    ProgramAssignment:
      type: object
      required: [id, clientId, programId, programName, startDate]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        programId:
          type: integer
        programName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date

    ProgramAssignmentInput:
      type: object
      required: [programId, startDate]
      properties:
        programId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    # ── Workout Logs ────────────────────────────────────────────────────────
    WorkoutLog:
      type: object
      required: [id, clientId, date, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        programDayId:
          type: ["integer", "null"]
        programDayName:
          type: ["string", "null"]
        date:
          type: string
          format: date
        durationMinutes:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [in_progress, completed, early_exit, cancelled]
        createdAt:
          type: string
          format: date-time

    WorkoutLogInput:
      type: object
      required: [date]
      properties:
        programDayId:
          type: integer
        date:
          type: string
          format: date
        durationMinutes:
          type: integer
        notes:
          type: string

    WorkoutLogUpdate:
      type: object
      properties:
        notes:
          type: string
        status:
          type: string
          enum: [in_progress, completed, early_exit, cancelled]

    WorkoutLogDetail:
      type: object
      required: [id, clientId, date, status, sets]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        programDayId:
          type: ["integer", "null"]
        programDayName:
          type: ["string", "null"]
        date:
          type: string
          format: date
        durationMinutes:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [in_progress, completed, early_exit, cancelled]
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SetLog"
        createdAt:
          type: string
          format: date-time

    SetLog:
      type: object
      required: [id, workoutLogId, exerciseId, exerciseName, setNumber, reps]
      properties:
        id:
          type: integer
        workoutLogId:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        setNumber:
          type: integer
        reps:
          type: integer
        weight:
          type: ["number", "null"]
        weightUnit:
          type: ["string", "null"]
          enum: [lbs, kg, null]
        rpe:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    SetLogInput:
      type: object
      required: [exerciseId, setNumber, reps]
      properties:
        exerciseId:
          type: integer
        setNumber:
          type: integer
        reps:
          type: integer
        weight:
          type: number
        weightUnit:
          type: string
          enum: [lbs, kg]
        rpe:
          type: integer
        notes:
          type: string

    CoachNote:
      type: object
      required: [id, clientId, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CoachNoteInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    CallLog:
      type: object
      required: [id, clientId, date, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        date:
          type: string
          format: date
        durationMinutes:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CallLogInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        durationMinutes:
          type: integer
        notes:
          type: string

    # ── Measurements ────────────────────────────────────────────────────────
    Measurement:
      type: object
      required: [id, clientId, date, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        date:
          type: string
          format: date
        weight:
          type: ["number", "null"]
        chest:
          type: ["number", "null"]
        waist:
          type: ["number", "null"]
        hips:
          type: ["number", "null"]
        arms:
          type: ["number", "null"]
        thighs:
          type: ["number", "null"]
        calves:
          type: ["number", "null"]
        leftArm:
          type: ["number", "null"]
        rightArm:
          type: ["number", "null"]
        leftThigh:
          type: ["number", "null"]
        rightThigh:
          type: ["number", "null"]
        leftCalf:
          type: ["number", "null"]
        rightCalf:
          type: ["number", "null"]
        bodyFat:
          type: ["number", "null"]
        unit:
          type: string
          enum: [imperial, metric]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MeasurementInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        weight:
          type: number
        chest:
          type: number
        waist:
          type: number
        hips:
          type: number
        arms:
          type: number
        thighs:
          type: number
        calves:
          type: number
        leftArm:
          type: number
        rightArm:
          type: number
        leftThigh:
          type: number
        rightThigh:
          type: number
        leftCalf:
          type: number
        rightCalf:
          type: number
        bodyFat:
          type: number
        unit:
          type: string
          enum: [imperial, metric]
        notes:
          type: string

    # ── Sleep ───────────────────────────────────────────────────────────────
    SleepLog:
      type: object
      required: [id, clientId, date, hoursSlept, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        date:
          type: string
          format: date
        hoursSlept:
          type: number
        quality:
          type: ["string", "null"]
          enum: [poor, fair, good, great, null]
        energyRating:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SleepLogInput:
      type: object
