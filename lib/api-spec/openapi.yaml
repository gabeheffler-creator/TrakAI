            application/json:
              schema:
                $ref: "#/components/schemas/AiAlternativesResult"

  # ── Coach Notes ───────────────────────────────────────────────────────────
  /clients/{clientId}/coach-notes:
    get:
      operationId: listCoachNotes
      tags: [coach]
