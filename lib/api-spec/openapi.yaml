        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestAlternativeInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTask"

  /clients/{clientId}/tasks/{taskId}/leave:
    patch:
      operationId: leaveTask
      tags: [tasks]
      summary: Coach leaves a rejected task alone
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTask"

  /clients/{clientId}/tasks/{taskId}/ai-alternatives:
    get:
      operationId: getTaskAiAlternatives
      tags: [tasks]
      summary: Get 3 AI-generated alternative task suggestions
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Three AI-generated alternatives
