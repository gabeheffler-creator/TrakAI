        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachNoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNote"

  /clients/{clientId}/coach-notes/{noteId}:
    patch:
      operationId: updateCoachNote
      tags: [coach]
      summary: Update a coach note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachNoteInput"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNote"
    delete:
      operationId: deleteCoachNote
      tags: [coach]
      summary: Delete a coach note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Call Logs ─────────────────────────────────────────────────────────────
  /clients/{clientId}/call-logs:
    get:
      operationId: listCallLogs
      tags: [coach]
      summary: List coaching call logs for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallLog"
    post:
      operationId: createCallLog
      tags: [coach]
      summary: Log a coaching call
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallLogInput"
      responses:
        "201":
          description: Call logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallLog"

  /clients/{clientId}/call-logs/{callId}:
    patch:
      operationId: updateCallLog
      tags: [coach]
      summary: Update a call log
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: callId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallLogInput"
      responses:
        "200":
          description: Updated call log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallLog"
    delete:
      operationId: deleteCallLog
      tags: [coach]
      summary: Delete a call log
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: callId
          in: path
          required: true
          schema:
            type: integer
      responses:
