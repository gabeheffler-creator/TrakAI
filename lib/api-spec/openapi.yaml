openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trak fitness coaching platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Session-based authentication
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: workouts
    description: Workout programs and logs
  - name: exercises
    description: Exercise library
  - name: measurements
    description: Body measurements
  - name: sleep
    description: Sleep logs
  - name: nutrition
    description: Nutrition screenshots
  - name: photos
    description: Progress photos
  - name: assignments
    description: Coach assignments
  - name: messages
    description: In-app messaging
  - name: tasks
    description: Coach-assigned tasks
  - name: invites
    description: Client invite links
  - name: dashboard
    description: Dashboard aggregates

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/coach/login:
    post:
      operationId: coachLogin
      tags: [auth]
      summary: Sign in as a coach with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /auth/client/login:
    post:
      operationId: clientLogin
      tags: [auth]
      summary: Sign in as a client with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Destroy the current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/token/login:
    post:
      operationId: tokenLogin
      tags: [auth]
      summary: Create native opaque access and refresh tokens
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NativeLoginInput" } } } }
      responses:
        "200": { description: Tokens issued, content: { application/json: { schema: { $ref: "#/components/schemas/NativeTokenPair" } } } }
        "401": { description: Invalid credentials }
  /auth/token/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Rotate a native refresh token
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshTokenInput" } } } }
      responses:
        "200": { description: Tokens rotated, content: { application/json: { schema: { $ref: "#/components/schemas/NativeTokenPair" } } } }
        "401": { description: Invalid refresh token }
  /auth/token/revoke:
    post:
      operationId: revokeToken
      tags: [auth]
      summary: Revoke a native session by refresh token
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshTokenInput" } } } }
      responses: { "200": { description: Revoked } }
  /auth/sessions:
    get:
      operationId: listAuthSessions
      tags: [auth]
      summary: List active sessions for the authenticated actor
      responses:
        "200": { description: Sessions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuthSession" } } } } }
  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllAuthSessions
      tags: [auth]
      summary: Revoke all sessions for the authenticated actor
      responses: { "200": { description: Revoked } }
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      tags: [auth]
      summary: Revoke one of the authenticated actor's sessions
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Revoked } }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset without exposing account existence
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetRequest" } } } }
      responses: { "200": { description: Accepted } }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Consume a password reset token
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetConfirmation" } } } }
      responses: { "200": { description: Password changed } }
  /auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: Send a verification token for the authenticated actor
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/EmailVerificationRequest" } } } }
      responses: { "200": { description: Accepted } }
  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      summary: Consume an email verification token
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmailVerificationConfirmation" } } } }
      responses: { "200": { description: Email verified } }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Clients ──────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{clientId}/status:
    patch:
      operationId: updateClientStatus
      tags: [clients]
      summary: Activate or deactivate a client (coach only)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "403":
          description: Coach only
        "404":
          description: Not found

  /clients/{clientId}/activity-heatmap:
    get:
      operationId: getClientActivityHeatmap
      tags: [clients]
      summary: Get a calendar heatmap of days a client logged data (workouts, nutrition, sleep, measurements, or progress photos)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-day activity counts for the trailing 365 days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityHeatmapEntry"
        "404":
          description: Not found

  # ── Client Goals ──────────────────────────────────────────────────────────
  /clients/{clientId}/goals:
    post:
      operationId: createClientGoal
      tags: [clients]
      summary: Create a new goal, archiving the current one to history
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGoalInput"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found

  /clients/{clientId}/goals/history:
    get:
      operationId: listClientGoalHistory
      tags: [clients]
      summary: List archived goals for a client, newest first
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientGoalHistory"
        "404":
          description: Not found

  # ── Invite Links ──────────────────────────────────────────────────────────
  /clients/{clientId}/invite:
    post:
      operationId: generateInviteLink
      tags: [invites]
      summary: Generate or refresh an invite link for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"

  /invite/{token}:
    get:
      operationId: getInvite
      tags: [invites]
      summary: Get invite info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        "404":
          description: Invalid or expired token

  /invite/{token}/register:
    post:
      operationId: registerInvite
      tags: [invites]
      summary: Accept a one-time client invitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InviteRegistrationInput" } } } }
      responses:
        "201": { description: Registered }
        "400": { description: Invalid or expired invitation }
  /clients/{clientId}/invite/send-email:
    post:
      operationId: sendClientInviteEmail
      tags: [invites]
      summary: Send a server-derived invitation to an owned client
      parameters: [{ name: clientId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Sent }
        "403": { description: Coach only }

  /clients/me:
    get:
      operationId: getMyClient
      tags: [clients]
      summary: Get the client record for the currently authenticated client
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Not signed in
        "404":
          description: No client account found for this user

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/coach:
    get:
      operationId: getCoachDashboard
      tags: [dashboard]
      summary: Get coach dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachDashboard"

  /dashboard/client/{clientId}:
    get:
      operationId: getClientDashboard
      tags: [dashboard]
      summary: Get a single client's dashboard summary
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDashboard"

  # ── Exercises (library) ───────────────────────────────────────────────────
  /exercises:
    get:
      operationId: listExercises
      tags: [exercises]
      summary: List all exercises
      responses:
        "200":
          description: Exercise list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
    post:
      operationId: createExercise
      tags: [exercises]
      summary: Create an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"

  /exercises/{exerciseId}:
    patch:
      operationId: updateExercise
      tags: [exercises]
      summary: Update an exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExercisePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          description: Not found

  # ── Workout Programs ──────────────────────────────────────────────────────
  /programs:
    get:
      operationId: listPrograms
      tags: [workouts]
      summary: List all workout programs
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [workouts]
      summary: Create a workout program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/generate-ai:
    post:
      operationId: generateAiProgram
      tags: [workouts]
      summary: Generate a complete workout program using AI based on a training goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProgramInput"
      responses:
        "201":
          description: Created program with full day and exercise detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
        "400":
          description: Invalid input
        "404":
          description: Client not found or not owned by this coach
        "500":
          description: AI generation failed

  /programs/{programId}:
    get:
      operationId: getProgram
      tags: [workouts]
      summary: Get a program with its days and exercises
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDetail"
    patch:
      operationId: updateProgram
      tags: [workouts]
      summary: Update a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    delete:
      operationId: deleteProgram
      tags: [workouts]
      summary: Delete a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/sleep-adjustment:
    patch:
      operationId: updateProgramSleepAdjustment
      tags: [workouts]
      summary: Update sleep auto-adjustment settings for a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramSleepAdjustment"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs/{programId}/approve:
    post:
      operationId: approveProgram
      tags: [workouts]
      summary: Approve a draft workout program for client assignment
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Program not found

  /programs/{programId}/phases:
    post:
      operationId: createProgramPhase
      tags: [workouts]
      summary: Add a phase to a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramPhaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPhase"

  /programs/{programId}/phases/{phaseId}:
    patch:
      operationId: updateProgramPhase
      tags: [workouts]
      summary: Update a program phase
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramPhaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPhase"
    delete:
      operationId: deleteProgramPhase
      tags: [workouts]
      summary: Delete a program phase
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/phases/{phaseId}/nutrition-goal:
    put:
      operationId: setPhaseNutritionGoal
      tags: [workouts]
      summary: Set (upsert) a phase-level nutrition goal
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramNutritionGoalInput"
      responses:
        "200":
          description: Upserted phase nutrition goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramNutritionGoal"

  /programs/{programId}/phases/{phaseId}/days/{dayId}/nutrition-goal:
    put:
      operationId: setDayNutritionGoal
      tags: [workouts]
      summary: Set (upsert) a day-level nutrition goal override
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramNutritionGoalInput"
      responses:
        "200":
          description: Upserted day nutrition goal override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramNutritionGoal"
    delete:
      operationId: deleteDayNutritionGoal
      tags: [workouts]
      summary: Remove a day-level nutrition goal override (reverts to phase default)
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: phaseId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/days:
    post:
      operationId: createProgramDay
      tags: [workouts]
      summary: Add a day to a program
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDayInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDay"

  /programs/{programId}/days/{dayId}:
    patch:
      operationId: updateProgramDay
      tags: [workouts]
      summary: Update a program day
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDayUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramDay"
    delete:
      operationId: deleteProgramDay
      tags: [workouts]
      summary: Delete a program day
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /programs/{programId}/days/{dayId}/exercises:
    post:
      operationId: addExerciseToDay
      tags: [workouts]
      summary: Add an exercise to a program day
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramExerciseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramExercise"

  /programs/{programId}/days/{dayId}/exercises/{peId}:
    patch:
      operationId: updateProgramExercise
      tags: [workouts]
      summary: Update a program day exercise
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: peId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramExerciseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramExercise"
    delete:
      operationId: deleteProgramExercise
      tags: [workouts]
      summary: Delete a program day exercise
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: peId
          in: path
          required: true
