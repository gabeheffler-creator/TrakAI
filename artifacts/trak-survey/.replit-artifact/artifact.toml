kind = "web"
previewPath = "/survey/"
title = "TrakAI Beta Survey"
version = "1.0.0"
id = "artifacts/trak-survey"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/survey/" ]
localPort = 19035

[services.development]
run = "pnpm --filter @workspace/trak-survey run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trak-survey", "run", "build" ]
publicDir = "artifacts/trak-survey/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19035"
BASE_PATH = "/survey/"
